name: iOS Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Dar permisos a Gradle
        run: chmod +x gradlew

      - name: Forzar Xcode 16.2 (Versión Estable KMP)
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Compilar App de iOS (Destino Genérico)
        run: |
          cd iosApp
          xcodebuild build -scheme iosApp -destination 'generic/platform=iOS Simulator'

      - name: Compilar App de iOS
        run: |
          cd iosApp
          xcodebuild build -scheme iosApp -destination 'platform=iOS Simulator,name=iPhone 16'
